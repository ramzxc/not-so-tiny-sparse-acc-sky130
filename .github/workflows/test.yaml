name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # cocotb 2.1 requires Verilator >= 5.036; pin the tested version.
      - name: Build Verilator 5.052
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog autoconf flex bison help2man libfl-dev g++ make
          git clone --depth 1 --branch v5.052 https://github.com/verilator/verilator.git "$RUNNER_TEMP/verilator"
          cd "$RUNNER_TEMP/verilator"
          autoconf
          ./configure
          make -j2
          sudo make install

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      - name: Check shared activation and 512 B memory
        run: |
          cd test
          make -f Makefile.activation
          make -f Makefile.sparsity
          make -f Makefile.fifo
          make -f Makefile.dma
          python -m cocotb_tools.check_results sim_build/dma_opt/results.xml
          make -f Makefile.vpu
          make -f Makefile.mem SRAM_BYTES=512
          python -m cocotb_tools.check_results sim_build/mem_512/results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*

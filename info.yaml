# Tiny Tapeout project information
project:
  title:        "not-so-tiny sparse acc"      # Project title
  author:       "Aram Yun"      # Your name
  discord:      "ramzxc"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "not so tiny sparse acc"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_not_so_tiny_sparse_acc_ramzxc"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Keep the plain-Verilog wrapper first for Tiny Tapeout port discovery.
  source_files:
    - "wrapper/project.v"
    - "rtl/shared_sram.sv"
    - "rtl/project.v"
    - "rtl/uart/uart_rx.v"
    - "rtl/uart/uart_tx.v"
    - "rtl/core/inst_fifo.v"
    - "rtl/core/micro_ctrl.v"
    - "rtl/core/dma_ctrl.v"
    - "rtl/core/inst_decoder.v"
    - "rtl/core/data_ctrl.v"
    - "rtl/core/exec_unit.sv"
    - "rtl/mem_itf.sv"
    - "rtl/qspi_ctrl.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: "UART_RX"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "DECODER_READY"
  uo[1]: "ERROR"
  uo[2]: ""
  uo[3]: ""
  uo[4]: "UART_TX"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "FLASH_CS_N"
  uio[1]: "QSPI_DQ0"
  uio[2]: "QSPI_DQ1"
  uio[3]: "QSPI_SCK"
  uio[4]: "QSPI_DQ2"
  uio[5]: "QSPI_DQ3"
  uio[6]: "PSRAM_A_CS_N_UNUSED"
  uio[7]: "PSRAM_B_CS_N_UNUSED"

# Do not change!
yaml_version: 6

# Tiny Tapeout project information
project:
  title:        "not-so-tiny sparse acc"      # Project title
  author:       "Aram Yun"      # Your name
  discord:      "ramzxc"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "not so tiny sparse acc"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_not_so_tiny_sparse_acc_ramzxc"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  # Keep the plain-Verilog top first for Tiny Tapeout port discovery.
  source_files:
    - "project.v"
    - "tpu_pkg.sv"
    - "acc_host.sv"
    - "mem_ctrl.sv"
    - "shared_sram.sv"
    - "acc_spi.sv"
    - "activation.sv"
    - "activation_ctrl.sv"
    - "axi_master_adapter.sv"
    - "dma.sv"
    - "inst_decoder.sv"
    - "inst_fifo.sv"
    - "mac_unit.sv"
    - "sparsity_ctrl.sv"
    - "tpu.sv"
    - "tpu_core.sv"
    - "vpu.sv"
    - "vpu_ctrl.sv"
    - "weight_load_ctrl.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SPI_SCK"
  ui[1]: "SPI_CS_N"
  ui[2]: "SPI_MOSI"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "AXI_AWVALID"
  uo[1]: "AXI_WVALID"
  uo[2]: "AXI_ARVALID"
  uo[3]: "INST_EMPTY"
  uo[4]: "INST_FULL"
  uo[5]: "SYNC_DONE"
  uo[6]: "AXI_ERROR"
  uo[7]: "HOST_ERROR"

  # Bidirectional pins
  uio[0]: "SPI_MISO"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
